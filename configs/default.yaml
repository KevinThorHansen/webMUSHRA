testname: webMUSHRA Example
testId: default_example
bufferSize: 2048
stopOnErrors: true
showButtonPreviousPage: true
remoteService: service/write.php


pages:
    - type: generic
      id: first_page
      name: Welcome
      content: |-
        <p><strong>Welcome, and thank you for taking part in this listening test.</strong></p>
        <p>This test is part of a Master's thesis at Aalborg University on neural sound matching for the Serum 2 wavetable synthesizer. Your ratings will help evaluate how closely automatically generated synthesizer presets recreate a target sound.</p>

        <h3>What you will do</h3>
        <p>You will hear 8 trials. In each trial you are given a reference sound at the top of the page, and 4 different versions of that sound below. Your task is to rate how similar each version sounds to the reference, on a scale from 0 (very different) to 100 (identical).</p>
        <p>You can switch freely between the versions and adjust your ratings as many times as you like before moving on. There is no time limit, and you can take short breaks between trials. The whole test takes approximately 20 to 30 minutes.</p>

        <h3>Before you start</h3>
        <p>Please use headphones in a quiet environment. The test relies on clear stereo playback, and laptop speakers or phone speakers will not give reliable results.</p>
        <p>You will be asked to indicate your age range on the next page. No other personal information (name, email, etc.) is collected, and your responses are stored anonymously under a randomly generated session ID. Participation is for adults aged 18 and over.</p>
        <p>By proceeding past this page you consent to the anonymous use of your ratings for academic research purposes, in accordance with the EU General Data Protection Regulation.</p>
        <p><strong>When you are ready, click "Continue" to begin.</strong></p>       
    - type: mushra
      id: trial1
      name: MUSHRA
      content: This training shows how to use our user interface. Please perform the underlined instructions to proceed with the training session. Reminder: In a MUSHRA listening test you are asked to rate the Basic Audio Quality (BAQ) of each condition.<br/>Basic Audio Quality is a single and global attribute that is used to judge any and all detected differences between the reference and the condition.
      showWaveform: true
      enableLooping: true 
      reference: configs/resources/audio/mono_ref.wav
      createAnchor35: true
      createAnchor70: true
      stimuli:
          C1: configs/resources/audio/mono_c1.wav
          C2: configs/resources/audio/mono_c2.wav
          C3: configs/resources/audio/mono_c3.wav
    - 
          - random
          - type: mushra
            id: trial_random_1
            name: MUSHRA - Random 2
            content: Due to randomization, this page will be either the second MUSHRA page or the third MUSHRA page.
            enableLooping: true 
            reference: configs/resources/audio/mono_ref.wav
            createAnchor35: false
            createAnchor70: false
            stimuli:
                C1: configs/resources/audio/mono_c1.wav
                C2: configs/resources/audio/mono_c2.wav
                C3: configs/resources/audio/mono_c3.wav          
          - type: mushra
            id: trial_random_2
            name: MUSHRA - Random 1
            content: Due to randomization, this page will be either the second MUSHRA page or the third MUSHRA page.
            enableLooping: true 
            reference: configs/resources/audio/mono_ref.wav
            createAnchor35: false
            createAnchor70: false
            stimuli:
                C1: configs/resources/audio/mono_c1.wav
                C2: configs/resources/audio/mono_c2.wav
                C3: configs/resources/audio/mono_c3.wav          
    - type: finish
      name: Thank you
      content: Thank you for attending!
      showResults: true
      writeResults: true
      questionnaire:
          - type: text
            label: eMail
            name: email
          - type: number
            label: Age
            name: age
            min: 0
            max: 100
            default: 30
          - type: likert
            name: gender
            label: Gender
            response:
             - value: female
               label: Female
             - value: male
               label: Male
             - value: other
               label: Other
